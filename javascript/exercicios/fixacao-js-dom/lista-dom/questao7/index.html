<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Questão 7</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <main>
        <h1>Entre em Contato</h1>

        <form class="form" onsubmit="enviarMensagem(event)">
            <label for="nome">Nome</label>
            <input type="text" id="nome" placeholder="Digite seu nome" required>

            <label for="email">E-mail</label>
            <input type="email" id="email" placeholder="Digite seu e-mail" required>

            <label for="assunto">Assunto</label>
            <input type="text" id="assunto" placeholder="Assunto da mensagem" required>

            <label for="mensagem-texto">Mensagem</label>
            <textarea id="mensagem-texto" rows="5" placeholder="Escreva sua mensagem" required></textarea>

        <button type="submit" class="btn">Enviar mensagem</button>
        <button type="reset" class="btn-secondary">Limpar</button>
        
        <p id="feedback-contato">Recebemos sua mensagem!</p>
        </form>
    </main>
</body>
</html>
