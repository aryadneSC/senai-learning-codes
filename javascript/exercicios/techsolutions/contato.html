<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Star Tech - Contato</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <header class="logo-area">
        <a href="index.html" class="logo">
            <img src="img/logo.png" alt="Logo da Star Tech" class="logo-img">
        </a>

        <nav aria-label="Navegação Principal">
            <ul class="nav-list">
                <li><a href="index.html">Início</a></li>
                <li><a href="servicos.html">Serviços</a></li>
                <li><a href="contato.html" aria-current="page">Contato</a></li>

                <!-- botões modo escuro/claro-->
                <li><button id="btn-dark" class="btn-dark" onclick="ativarModoEscuro()">Modo Escuro</button></li>
                <li><button id="btn-light" class="btn-dark" onclick="ativarModoClaro()">Modo Claro</button></li>
            </ul>
        </nav>
    </header>

    <main class="container">
        <h1 class="page-title">Entre em Contato</h1>

        <p class="intro-contato">Gostou dos nossos serviços? 
            Envie-nos uma mensagem e nossa equipe entrará em contato com você!</p>

        <form class="form" onsubmit="enviarMensagem(event)">
            <label for="nome">Nome</label>
            <input type="text" id="nome" placeholder="Digite seu nome" required>

            <label for="email">E-mail</label>
            <input type="email" id="email" placeholder="Digite seu e-mail" required>

            <label for="assunto">Assunto</label>
            <input type="text" id="assunto" placeholder="Assunto da mensagem" required>

            <label for="mensagem-texto">Mensagem</label>
            <textarea id="mensagem-texto" rows="5" placeholder="Escreva sua mensagem" required></textarea>

        <button type="submit" class="btn">Enviar mensagem</button>
        <button type="reset" class="btn-secondary">Limpar</button>
        </form>
        
        <p id="feedback-contato">Preencha o formulário para entrar em contato conosco.</p>
    </main>

    <footer>
        <p>&copy; 2026 Star Tech. Todos os direitos reservados.</p>
        <p>contato: startech@email.com</p>
    </footer>
</body>
</html>
