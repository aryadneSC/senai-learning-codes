<!DOCTYPE html>
<html dir="ltr" lang="pt-BR">
<head>
    <link rel="stylesheet" href="style.css" type="text/css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscrição</title>
</head>
<body>
    <header>
        <div class="logo-tech">
            <img src="img/te-logo.png" alt="Logo da Tech Wave">
            <h1>Tech Experience 2026</h1>
        </div>
        <nav>
            <a href="index.html">Início</a>
            <a href="sobre.html">Sobre</a>
            <a href="inscricao.html">Inscrição</a>
        </nav>
    </header>

    <main class="inscricao-conteiner">
        <h2>Formulário de Inscrição</h2>

        <form action="/enviar" method="POST">
            <fieldset>
                <legend>Dados Pessoais</legend>

                <label for="nome-completo">Nome completo:</label>
                <input type="text" id="nome-completo" placeholder="Digite seu nome" minlength="10" required><br>

                <label for="email">E-mail:</label>
                <input type="email" id="email" placeholder="Digite seu e-mail" required><br>

                <label for="telefone">Telefone</label>
                <input type="tel" id="telefone" placeholder="Telefone com DDD" minlength="13"><br>

                <label for="data-nasc">Data de nascimento:</label>
                <input type="date" id="data-nasc"><br>
            </fieldset>

            <fieldset>
                <legend>Perfil</legend>
                <label>Você é:</label>
                <div class="inline">
                    <label for="estudante">Estudante</label>
                    <input type="radio" name="titulo" id="estudante">
                    <label for="professor">Professor</label>
                    <input type="radio" name="titulo" id="professor">
                    <label for="profissional-area">Profissional da área</label>
                    <input type="radio" name="titulo" id="profissional-area"><br>
                </div>
            </fieldset>

            <fieldset>
                <legend>Área de Interesse</legend>
                <div class="inline">
                    <label for="frontend">Front-End</label>
                    <input type="checkbox" name="frontend" id="frontend">
                    <label for="backend">Back-End</label>
                    <input type="checkbox" name="backend" id="backend">
                    <label for="mobile">Mobile</label>
                    <input type="checkbox" name="mobile" id="mobile">
                    <label for="dados">Dados</label>
                    <input type="checkbox" name="dados" id="dados">
                </div>
            </fieldset>

            <fieldset>
                <legend>Localização</legend>
                
                <label for="cidade">Cidade:</label>
                <input type="text" id="cidade">
                <label for="estado">Estado:</label>
                
                <select name="estado" id="estado">
                    <option id="estado" value="ba">BA</option>
                    <option id="estado" value="ba">SP</option>
                    <option id="estado" value="ba">RJ</option>
                    <option id="estado" value="ba">MG</option>
                    <option id="estado" value="ba">SE</option><br>
                </select>
            </fieldset>

            <fieldset>
                <legend>Extras</legend>
                
                <label for="obs">Observações</label>
                <textarea name="obs" id="obs" rows="4"></textarea>

                <div class="inline">
                    <input type="checkbox" id="novidades">
                    <label for="novidades">Desejo receber novidades por e-mail</label>
                </div>
            </fieldset>

            <div class="botoes">
                <button class="btn btn-secundario" type="reset">Limpar Formulário</button>
                <button class="btn" type="submit">Finalizar Inscrição</button>
            </div>
        </form>
    </main>

    <footer>
        <p>&copy; 2026 Tech Experience. Todos os direitos reservados.</p>
    </footer>
    
</body>
</html>
